name: Publish to npm

# Publishing is driven by GitHub Releases: draft a release, publish it, and this
# workflow publishes the exact version in package.json. No npm token is stored:
# npm verifies the workflow's OIDC identity instead (trusted publishing), so
# there is nothing to rotate and nothing that expires.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for OIDC: this is what npm trusts instead of a token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs an OIDC-aware npm CLI (11.5.1 or newer).
      - name: Use the latest npm
        run: npm install --global npm@latest

      - name: Toolchain versions
        run: |
          node --version
          npm --version

      # Guard: a release tagged v0.1.2 must not publish whatever version
      # happens to be in package.json.
      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG does not match package.json version $VER"
            exit 1
          fi

      # --provenance records how the artefact was built; --access public is
      # required for scoped packages. No NODE_AUTH_TOKEN on purpose.
      - name: Publish
        run: npm publish --provenance --access public
